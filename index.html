<style>

.app{min-height:100vh}

.grid-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:18px}

.metric-top{display:flex;align-items:center;justify-content:space-between;gap:8px}

.product-photo,.photo-placeholder{width:42px;height:42px;border-radius:11px;object-fit:cover;flex:none}

.empty{padding:48px 18px;text-align:center;color:var(--muted)}

.more-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.more-card{padding:19px;border:1px solid var(--line);border-radius:18px;background:#fff;cursor:pointer;transition:.18s;box-shadow:var(--shadow)}

.more-icon{width:42px;height:42px;border-radius:13px;background:#eef5ff;color:var(--brand);display:grid;place-items:center;margin-bottom:13px}
.more-card h3{margin:0 0 5px;font-size:14px}.more-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi-mini{padding:14px;border-radius:15px;background:var(--soft);border:1px solid var(--line)}
.kpi-mini b{font-size:18px}.kpi-mini span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:11px;color:#667085;font-weight:800}
.dialog-note{font-size:11px;color:var(--muted);line-height:1.5}.dialog-note .success,.dialog-note .warning{display:inline-flex;align-items:center;gap:5px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal.show{display:flex}
.dialog{width:min(800px,100%);max-height:min(90vh,900px);overflow:auto;background:#fff;border:1px solid rgba(255,255,255,.7);
  border-radius:24px;box-shadow:var(--shadow-lg);animation:modalIn .22s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:21px 22px 14px;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);z-index:2;border-bottom:1px solid #f0f2f6}
.dialog-head h2{margin:0;font-size:20px;letter-spacing:-.03em}.dialog-head p{margin:5px 0 0;color:var(--muted);font-size:11px}
.dialog-body{padding:18px 22px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 20px;border-top:1px solid #f0f2f6}
.image-upload{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center;padding:12px;border:1px dashed #cbd5e1;border-radius:15px;background:#fbfcfe}
.image-preview{width:86px;height:86px;border-radius:15px;object-fit:cover;background:#eef2f7}
.order-items{display:grid;gap:9px}
.item-row{display:grid;grid-template-columns:minmax(0,1.6fr) 76px 110px 38px;gap:8px;align-items:center}
.item-total{font-size:12px;font-weight:800;text-align:right;color:#334155}
.order-summary{display:grid;gap:8px;border:1px solid var(--line);padding:14px;border-radius:15px;background:#fbfcfe}
.summary-row{display:flex;justify-content:space-between;gap:10px;font-size:13px}.summary-row.total{font-size:17px;font-weight:850;padding-top:8px;border-top:1px solid var(--line)}
.preview-big{width:100%;max-height:330px;object-fit:contain;background:#f8fafc;border-radius:16px}
.toast{position:fixed;right:20px;bottom:20px;z-index:140;display:none;min-width:230px;max-width:360px;color:#fff;background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;box-shadow:0 18px 40px rgba(15,23,42,.25)}
.toast.show{display:flex;gap:10px;align-items:flex-start;animation:toastIn .22s ease}
.toast.ok:before{content:"✓";width:22px;height:22px;border-radius:8px;background:#059669;display:grid;place-items:center;font-weight:900}
.toast.bad:before{content:"!";width:22px;height:22px;border-radius:8px;background:#dc2626;display:grid;place-items:center;font-weight:900}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;position:relative;overflow:hidden;background:
 radial-gradient(circle at 12% 20%,rgba(59,130,246,.22),transparent 30%),
 radial-gradient(circle at 88% 80%,rgba(99,102,241,.16),transparent 30%),#eef4ff}
.login-orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35}
.orb1{width:310px;height:310px;left:-130px;top:-120px;background:#3b82f6}.orb2{width:260px;height:260px;right:-100px;bottom:-100px;background:#818cf8}

  .panel{padding:14px;border-radius:17px}.table-wrap{display:none}.mobile-list{display:grid;gap:9px}

  .mc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}

  .mc-photo{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none}

  .formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.dialog{max-height:94vh;border-radius:22px}.dialog-head{padding:18px 17px 13px}.dialog-body{padding:15px 17px}.dialog-foot{padding:12px 17px 17px}
  .item-row{grid-template-columns:minmax(0,1fr) 66px 95px 36px}.item-row .item-total{display:none}
  .more-cards{grid-template-columns:1fr}.kpi-row{grid-template-columns:1fr 1fr 1fr;gap:8px}.kpi-mini{padding:11px}.kpi-mini b{font-size:14px}

    background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:60}

window.togglePass=()=>{const x=$("#passwordInput");x.type=x.type==="password"?"text":"password"};
window.submitPassword=async()=>{
  const p=$("#passwordInput")?.value||"", first=!state.settings.passwordHash;
  if(p.length<4)return showToast("Пароль должен содержать минимум 4 символа","bad");
  if(first&&p!==$("#passwordConfirm")?.value)return showToast("Пароли не совпадают","bad");
  const btn=$("#loginBtn");btn.disabled=true;btn.innerHTML=`<span class="spinner"></span>${first?"Создание…":"Проверка…"}`;
  try{
    const h=await hashText(p);
    if(first){state.settings.passwordHash=h;await setDoc(doc(db,"settings","main"),{...state.settings},{merge:true});sessionStorage.setItem("bineUnlocked","1");await loadAll();return}
    if(h!==state.settings.passwordHash){btn.disabled=false;btn.textContent="Войти";return showToast("Неверный пароль","bad")}
    sessionStorage.setItem("bineUnlocked","1");await loadAll();
  }catch(e){console.error(e);btn.disabled=false;showToast(firebaseError(e),"bad")}
};

async function hashText(text){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function firebaseError(e){return e?.code==="permission-denied"?"Нет доступа к Firestore. Проверьте правила базы.":e?.message||"Произошла ошибка"}
function c(name){return collection(db,name)}
async function readCollection(name){const snap=await getDocs(c(name));return snap.docs.map(d=>({id:d.id,...d.data()}))}
async function loadAll(){
  state.loading=true;renderLoading();
  try{
    const [products,orders,purchases,clients,transactions,settingsDoc]=await Promise.all([
      readCollection("products"),readCollection("orders"),readCollection("purchases"),readCollection("clients"),readCollection("transactions"),getDoc(doc(db,"settings","main"))
    ]);
    state.products=products;state.orders=orders;state.purchases=purchases;state.clients=clients;state.transactions=transactions;
    if(settingsDoc.exists())state.settings={...state.settings,...settingsDoc.data()};
    state.loading=false;render();
  }catch(e){state.loading=false;renderError(firebaseError(e))}
}
function renderLoading(){root.innerHTML=`<div class="login"><div class="loginbox"><div class="login-brand"><div class="brandmark">${icon("refresh",22)}</div><div><b>Bine Store</b><small>Загрузка CRM…</small></div></div><p>Подключаем Firestore и синхронизируем данные.</p><div class="progress"><div style="width:62%"></div></div></div></div>`}
function renderError(msg){root.innerHTML=`<div class="login"><div class="loginbox"><div class="login-brand"><div class="brandmark">${icon("info",22)}</div><div><b>Bine Store CRM</b><small>Ошибка подключения</small></div></div><h1>Не удалось загрузить данные</h1><p>${esc(msg)}</p><button class="btn primary" style="width:100%" onclick="location.reload()">${icon("refresh",16)}Повторить</button></div></div>`}

function isOrderCompleted(status){return status==="Выполнен"||status==="Закрыт"}
function orderInventoryReady(order, rows){
  const needed=new Map();
  (rows||[]).forEach(i=>needed.set(i.productId,(needed.get(i.productId)||0)+num(i.qty)));
  if(order&&isOrderCompleted(order.status)) (order.items||[]).forEach(i=>needed.set(i.productId,(needed.get(i.productId)||0)-num(i.qty)));
  for(const [pid,qty] of needed){if(num(qty)<=0)continue;const product=state.products.find(p=>p.id===pid);if(!product||num(product.qty)<qty)return false;}
  return true;
}
function completedOrders(){return state.orders.filter(o=>isOrderCompleted(o.status))}

function getStats(){
  const finished=completedOrders();
  const revenue=finished.reduce((a,o)=>a+num(o.total),0);
  const cost=finished.reduce((a,o)=>a+num(o.cost),0);
  const expenses=state.transactions.filter(t=>t.type==="Расход").reduce((a,t)=>a+num(t.amount),0);
  const incomeManual=state.transactions.filter(t=>t.type==="Доход"&&!t.linkedOrderId).reduce((a,t)=>a+num(t.amount),0);
  const incomeFromOrders=nonCancelled.reduce((a,o)=>a+num(o.total),0);
  const profit=revenue-cost-expenses;
  const stockQty=state.products.reduce((a,p)=>a+num(p.qty),0);
  const stockValue=state.products.reduce((a,p)=>a+num(p.qty)*num(p.buyPrice),0);
  return {revenue,cost,expenses,incomeManual,incomeFromOrders,profit,stockQty,stockValue,orders:finished.length,budget:revenue+incomeManual-expenses,products:state.products.length};
}

function salesChart(period){
  const {labels,values}=aggregateSales(period), max=Math.max(...values,1), W=720,H=235,pad=32;
  const points=values.map((v,i)=>{const x=pad+(i*(W-pad*2))/Math.max(values.length-1,1),y=H-pad-(v/max)*(H-pad*2);return [x,y]});
  const line=points.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L ${points.at(-1)?.[0]||pad} ${H-pad} L ${pad} ${H-pad} Z`;
  return `<div class="chart-wrap"><svg class="svg-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="areaFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3b82f6" stop-opacity=".20"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>
    <line class="chart-grid" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line class="chart-grid" x1="${pad}" y1="${pad}" x2="${W-pad}" y2="${pad}"/><line class="chart-grid" x1="${pad}" y1="${(H)/2}" x2="${W-pad}" y2="${(H)/2}"/>
    <path d="${area}" class="chart-area"/><path d="${line}" class="chart-line"/>${points.map((p,i)=>`<circle class="chart-dot" cx="${p[0]}" cy="${p[1]}" r="${values.length>20?2.2:3.5}"><title>${labels[i]} · ${fmtMoney(values[i])}</title></circle>`).join("")}
    ${labels.filter((_,i)=>i===0||i===labels.length-1||i===Math.floor(labels.length/2)).map((x,j)=>`<text class="chart-tooltip" x="${j===0?pad:j===1?W/2:W-pad}" y="${H-5}" text-anchor="${j===0?"start":j===2?"end":"middle"}">${esc(x)}</text>`).join("")}</svg></div>`
}
function aggregateSales(period){
  const vals=[],labels=[],now=new Date();
  if(period==="year"){
    for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),next=new Date(d.getFullYear(),d.getMonth()+1,1);vals.push(completedOrders().filter(o=>new Date(o.date)>=d&&new Date(o.date)<next).reduce((a,o)=>a+num(o.total),0));labels.push(d.toLocaleDateString("ru-RU",{month:"short"}))}
  }else{
    const days=period==="week"?7:30;
    for(let i=days-1;i>=0;i--){const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const next=new Date(d);next.setDate(next.getDate()+1);vals.push(completedOrders().filter(o=>new Date(o.date)>=d&&new Date(o.date)<next).reduce((a,o)=>a+num(o.total),0));labels.push(d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"}))}
  }
  return {labels,values:vals}
}

async function compressImage(file){
  return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=720,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.78))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})
}
window.removeProduct=async id=>{
  const p=state.products.find(x=>x.id===id);if(!p)return;
  if(state.orders.some(o=>(o.items||[]).some(i=>i.productId===id)))return showToast("Товар связан с историей заказов — удаление запрещено","bad");
  if(!confirm("Удалить товар «"+p.name+"»?"))return;
  try{await deleteDoc(doc(db,"products",id));state.products=state.products.filter(x=>x.id!==id);renderPage();showToast("Товар удалён")}catch(e){showToast(firebaseError(e),"bad")}

    if(!rows.length)return showToast("Добавьте хотя бы один товар","bad");
    const clientId=$("#o_client").value,client=state.clients.find(x=>x.id===clientId),status=$("#o_status").value;
    if(status==="Выполнен"&&!orderInventoryReady(o,rows))return showToast("Нельзя выполнить заказ: товара пока недостаточно на складе","bad");
    const date=$("#o_date").value+"T12:00:00",delivery=num($("#o_delivery").value),extra=num($("#o_extra").value);

    try{await saveOrderAtomic(o,data);window.__editingOrder=null;closeModal();await loadAll();showToast("Заказ сохранён")}catch(e){showToast(firebaseError(e),"bad")}
  });

async function saveOrderAtomic(oldOrder,newData){
  const oldItems=isOrderCompleted(oldOrder?.status)?(oldOrder?.items||[]):[];
  const newItems=isOrderCompleted(newData.status)?newData.items:[];
  const result=await runTransaction(db,async tx=>{
    let assignedNumber=oldOrder?.number||null;
    let counterRef=null;
    let counterSnap=null;
    if(!oldOrder){
      counterRef=doc(db,"counters","orders");
      counterSnap=await tx.get(counterRef);
    }
    const productIds=[...new Set([...oldItems.map(i=>i.productId),...newItems.map(i=>i.productId)])];
    const productRefs=productIds.map(id=>doc(db,"products",id));
    const snaps=await Promise.all(productRefs.map(r=>tx.get(r)));
    const products=new Map(snaps.map((snap,i)=>[productIds[i],{ref:productRefs[i],snap,data:snap.exists()?snap.data():null}]));
    if(snaps.some(snap=>!snap.exists()))throw new Error("Один из товаров не существует");
    if(!oldOrder){
      const current=counterSnap?.exists()
        ? Math.max(1,num(counterSnap.data().nextNumber))
        : Math.max(0,...state.orders.map(x=>parseInt(x.number,10)).filter(Number.isFinite))+1;
      assignedNumber=String(current);
    }
    const delta=new Map();
    for(const i of oldItems)delta.set(i.productId,(delta.get(i.productId)||0)+num(i.qty));
    for(const i of newItems)delta.set(i.productId,(delta.get(i.productId)||0)-num(i.qty));
    for(const [pid,d] of delta){
      const p=products.get(pid).data,after=num(p.qty)+d;
      if(after<0)throw new Error("Недостаточно товара: "+p.name);
      tx.update(products.get(pid).ref,{qty:after,updatedAt:Date.now()});
    }
    if(counterRef){
      tx.set(counterRef,{nextNumber:num(assignedNumber)+1,updatedAt:Date.now()},{merge:true});
    }
    const orderRef=oldOrder?doc(db,"orders",oldOrder.id):doc(c("orders"));
    newData.number=assignedNumber;
    tx.set(orderRef,newData,{merge:true});
    const financeRef=doc(db,"transactions","order_"+orderRef.id);
    if(isOrderCompleted(newData.status)){
      tx.set(financeRef,{type:"Доход",amount:newData.total,date:newData.date,category:"Продажа",description:"Заказ #"+assignedNumber,linkedOrderId:orderRef.id,updatedAt:Date.now()},{merge:true});
    }else{
      tx.delete(financeRef);
    }
    return assignedNumber;
  });
  newData.number=result;
}
async function removeOrder(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  const completed=isOrderCompleted(o.status);
  if(!confirm("Удалить заказ #"+o.number+"?"+(completed?" Товар будет возвращён на склад.":"")))return;
  try{
    await runTransaction(db,async tx=>{
      const oldItems=completed?o.items||[]:[], qtyByProduct=new Map();
      oldItems.forEach(i=>qtyByProduct.set(i.productId,(qtyByProduct.get(i.productId)||0)+num(i.qty)));
      const productIds=[...qtyByProduct.keys()], refs=productIds.map(id=>doc(db,"products",id)), snaps=await Promise.all(refs.map(r=>tx.get(r)));
      snaps.forEach((snap,idx)=>{if(snap.exists()){const pid=productIds[idx];tx.update(refs[idx],{qty:num(snap.data().qty)+num(qtyByProduct.get(pid)),updatedAt:Date.now()})}});
      tx.delete(doc(db,"orders",id));tx.delete(doc(db,"transactions","order_"+id));
    });
    await loadAll();showToast("Заказ удалён, склад восстановлен")
  }catch(e){showToast(firebaseError(e),"bad")}
}

 const items=o.items||[];

async function savePurchaseAtomic(oldPurchase,newData){
  const oldReceived=oldPurchase?.status==="Получен";
  const newReceived=newData.status==="Получен";
  const oldItems=oldReceived?(oldPurchase?.items||[]):[];
  const newItems=newReceived?(newData.items||[]):[];
  const result=await runTransaction(db,async tx=>{
    let assignedNumber=oldPurchase?.number||null;
    let counterRef=null;
    let counterSnap=null;
    if(!oldPurchase){
      counterRef=doc(db,"counters","purchases");
      counterSnap=await tx.get(counterRef);
    }
    const ids=[...new Set([...oldItems.map(i=>i.productId),...newItems.map(i=>i.productId)])];
    const refs=ids.map(id=>doc(db,"products",id));
    const snaps=await Promise.all(refs.map(r=>tx.get(r)));
    const products=new Map(snaps.map((snap,i)=>[ids[i],{ref:refs[i],snap,data:snap.exists()?snap.data():null}]));
    if(snaps.some(snap=>!snap.exists()))throw Error("Один из товаров в закупке не существует");
    if(!oldPurchase){
      const current=counterSnap?.exists()
        ? Math.max(1,num(counterSnap.data().nextNumber))
        : Math.max(0,...state.purchases.map(x=>parseInt(x.number,10)).filter(Number.isFinite))+1;
      assignedNumber=String(current);
    }
    const delta=new Map();
    for(const i of oldItems)delta.set(i.productId,(delta.get(i.productId)||0)-num(i.qty));
    for(const i of newItems)delta.set(i.productId,(delta.get(i.productId)||0)+num(i.qty));
    const priceByProduct=new Map();
    for(const i of newItems)priceByProduct.set(i.productId,num(i.buyPrice));
    for(const [pid,d] of delta){
      const p=products.get(pid).data,after=num(p.qty)+d;
      if(after<0)throw Error("Нельзя отменить получение: на складе недостаточно остатка для возврата операции по "+p.name);
      const patch={qty:after,updatedAt:Date.now()};
      if(newReceived&&priceByProduct.has(pid))patch.buyPrice=priceByProduct.get(pid);
      tx.update(products.get(pid).ref,patch);
    }
    if(counterRef){
      tx.set(counterRef,{nextNumber:num(assignedNumber)+1,updatedAt:Date.now()},{merge:true});
    }
    const ref=oldPurchase?doc(db,"purchases",oldPurchase.id):doc(c("purchases"));
    newData.number=assignedNumber;
    tx.set(ref,newData,{merge:true});
    const fin=doc(db,"transactions","purchase_"+ref.id);
    if(newReceived){
      tx.set(fin,{type:"Расход",amount:newData.total,date:newData.date,category:"Закупка",description:"Закупка #"+assignedNumber+" · "+newData.supplier,linkedPurchaseId:ref.id,updatedAt:Date.now()},{merge:true});
    }else{
      tx.delete(fin);
    }
    return assignedNumber;
  });
  newData.number=result;
  return {number:result};
}
async function removePurchase(id){const p=state.purchases.find(x=>x.id===id);if(!p)return;if(!confirm("Удалить закупку #"+p.number+"? Если она получена, товар будет вычтен обратно со склада."))return;try{await savePurchaseAtomic(p,{...p,status:"Отменён",items:p.items,total:p.total});await deleteDoc(doc(db,"purchases",id));await loadAll();showToast("Закупка удалена")}catch(e){showToast(firebaseError(e),"bad")}}

function metricInline(label,val,ico,accent){const c=accent==="red"?"var(--red)":accent==="green"?"var(--green)":"var(--brand)";return `<div class="metric-top"><div class="metric-label">${label}</div><div class="metric-icon" style="color:${c};background:${accent==="red"?"#fef2f2":"#ecfdf5"}">${icon(ico,17)}</div></div><div class="metric-value">${val}</div><div class="metric-sub">за выбранный период</div>`}
function financeTable(arr){if(!arr.length)return emptyState("wallet","Нет операций","Измените период");return `<table class="table"><thead><tr><th>Тип</th><th>Сумма</th><th>Дата</th><th>Категория</th><th>Описание</th><th>Связь</th><th></th></tr></thead><tbody>${arr.map(t=>`<tr><td>${t.type==="Доход"?`<span class="badge badge-closed">Доход</span>`:t.type==="Расход"?`<span class="badge badge-cancel">Расход</span>`:`<span class="badge badge-work">Другое</span>`}</td><td><b class="${t.type==="Расход"?"danger":"success"}">${t.type==="Расход"?"−":"+"}${fmtMoney(t.amount)}</b></td><td>${fmtDate(t.date)}</td><td>${esc(t.category||"—")}</td><td>${esc(t.description||"—")}</td><td>${t.linkedOrderId?`#${esc((state.orders.find(o=>o.id===t.linkedOrderId)?.number)||"—")}`:"—"}</td><td>${t.linkedOrderId?"":`<button class="btn icon sm danger" onclick="removeTransaction('${t.id}')">${icon("trash",15)}</button>`}</td></tr>`).join("")}</tbody></table>`}
function financeMobile(t){return `<div class="mobile-card"><div class="mc-top"><div><b>${esc(t.category||t.type)}</b><div class="small">${fmtDate(t.date)}</div></div><b class="${t.type==="Расход"?"danger":"success"}">${t.type==="Расход"?"−":"+"}${fmtMoney(t.amount)}</b></div><div class="small">${esc(t.description||"Без описания")}${t.linkedOrderId?" · заказ #"+esc(state.orders.find(o=>o.id===t.linkedOrderId)?.number||"—"):""}</div>${t.linkedOrderId?"":`<button class="btn sm danger" onclick="removeTransaction('${t.id}')">${icon("trash",14)}Удалить</button>`}</div>`}
window.openTransaction=()=>{
 openModal("Новая операция","Ручная запись движения денег",`<div class="formgrid"><div class="field"><label>Тип</label><select id="t_type" class="control"><option>Доход</option><option>Расход</option><option>Другое</option></select></div><div class="field"><label>Сумма</label><input id="t_amount" type="number" min="0" step=".01" class="control" placeholder="0"></div><div class="field"><label>Дата</label><input id="t_date" type="date" class="control" value="${isoToday()}"></div><div class="field"><label>Категория</label><input id="t_cat" class="control" placeholder="Реклама, доставка…"></div><div class="field full"><label>Описание</label><textarea id="t_desc" class="control" rows="4"></textarea></div></div>`,async()=>{
   const amount=num($("#t_amount").value);if(amount<=0)return showToast("Введите сумму","bad");
   const data={type:$("#t_type").value,amount,date:$("#t_date").value+"T12:00:00",category:$("#t_cat").value.trim(),description:$("#t_desc").value.trim(),createdAt:Date.now()};
   try{const r=await addDoc(c("transactions"),data);state.transactions.push({id:r.id,...data});closeModal();renderPage();showToast("Операция добавлена")}catch(e){showToast(firebaseError(e),"bad")}
 })
}
window.removeTransaction=async id=>{const t=state.transactions.find(x=>x.id===id);if(!t||t.linkedOrderId)return;if(!confirm("Удалить операцию?"))return;try{await deleteDoc(doc(db,"transactions",id));state.transactions=state.transactions.filter(x=>x.id!==id);renderPage();showToast("Операция удалена")}catch(e){showToast(firebaseError(e),"bad")}};

function analyticsPage(){
 const s=getStats(), valid=completedOrders(),avg=s.orders?s.revenue/s.orders:0;
 const top={};valid.forEach(o=>(o.items||[]).forEach(i=>top[i.name]=(top[i.name]||0)+num(i.qty)));
 const tops=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,7),low=state.products.filter(p=>num(p.qty)<=2).sort((a,b)=>num(a.qty)-num(b.qty));
 return pageHeader("Аналитика","Продажи, товары и ключевые показатели")
 +`<div class="grid-metrics">${statCard("Продажи",fmtMoney(s.revenue),"оборот заказов","dollar")}${statCard("Расходы",fmtMoney(s.expenses),"ручные расходы","wallet","red")}${statCard("Прибыль",fmtMoney(s.profit),"после себестоимости","chart","green")}${statCard("Средний чек",fmtMoney(avg),"выручка / заказы","star")}</div>
 <div class="layout-2"><div class="panel"><div class="panel-head"><div><h2>График продаж</h2><div class="panel-sub">Сегодня / неделя / месяц / год</div></div><select class="control select-small" onchange="state.period=this.value;renderPage()"><option value="day" ${state.period==="day"?"selected":""}>Сегодня</option><option value="week" ${state.period==="week"?"selected":""}>Неделя</option><option value="month" ${state.period==="month"?"selected":""}>Месяц</option><option value="year" ${state.period==="year"?"selected":""}>Год</option></select></div>${salesChart(state.period==="day"?"week":state.period)}</div>
 <div class="panel"><div class="panel-head"><div><h2>Самые продаваемые</h2><div class="panel-sub">По количеству единиц</div></div></div>${tops.length?`<div class="mini-list">${tops.map((x,i)=>{const max=tops[0][1]||1;return `<div class="mini-row"><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:10px"><span class="ellipsis">${i+1}. ${esc(x[0])}</span><b>${x[1]} шт.</b></div><div class="progress" style="margin-top:6px"><div style="width:${x[1]/max*100}%"></div></div></div></div>`}).join("")}</div>`:emptyState("chart","Пока мало данных","Продажи появятся здесь")}</div></div>
 <div class="panel"><div class="panel-head"><div><h2>Низкий остаток</h2><div class="panel-sub">2 шт. и меньше</div></div><span class="section-link" onclick="go('products')">Открыть склад</span></div>${low.length?`<div class="mini-list">${low.slice(0,8).map(p=>`<div class="mini-row"><div><b>${esc(p.name)}</b><div class="small">${esc(p.category||"Без категории")}</div></div>${stockBadge(p.qty)}</div>`).join("")}</div>`:emptyState("package","Всё спокойно","Критичных остатков нет")}</div>`
}
function settingsPage(){
 return pageHeader("Настройки","Магазин, резервные копии и безопасность")
 +`<div class="panel"><div class="panel-head"><div><h2>Основное</h2><div class="panel-sub">Персонализация рабочей среды</div></div></div><div class="formgrid"><div class="field"><label>Название магазина</label><input id="shopNameSetting" class="control" value="${esc(state.settings.shopName)}"></div><div class="field"><label>Валюта</label><select id="currencySetting" class="control"><option value="MDL" selected>MDL — молдавский лей</option></select></div><div class="field full"><button class="btn primary" style="justify-self:start" onclick="saveSettings()">${icon("check",15)}Сохранить настройки</button></div></div></div>
 <div class="panel"><div class="panel-head"><div><h2>Данные и резервные копии</h2><div class="panel-sub">Полный экспорт или восстановление Firestore</div></div></div><div class="settings-list">
   <div class="setting"><div class="setting-info"><b>Экспорт JSON</b><span>Все товары, заказы, клиенты, финансы и настройки.</span></div><button class="btn" onclick="exportJSON()">${icon("download",15)}Экспорт</button></div>
   <div class="setting"><div class="setting-info"><b>Импорт JSON</b><span>Загрузите ранее сохранённую резервную копию.</span></div><button class="btn" onclick="$('#importJson').click()">${icon("upload",15)}Импорт</button><input id="importJson" class="file-input" type="file" accept=".json,application/json" onchange="importJSON(event)"></div>
   <div class="setting"><div class="setting-info"><b>Обновить данные</b><span>Полностью повторно синхронизировать CRM с Firestore.</span></div><button class="btn" onclick="loadAll()">${icon("refresh",15)}Синхронизировать</button></div>
 </div></div>
 <div class="panel"><div class="panel-head"><div><h2>Безопасность</h2><div class="panel-sub">Защита доступа к CRM</div></div></div><div class="settings-list">
   <div class="setting"><div class="setting-info"><b>Изменить пароль</b><span>Новый пароль сразу используется на этом устройстве.</span></div><button class="btn" onclick="changePassword()">${icon("shield",15)}Изменить</button></div>
   <div class="setting"><div class="setting-info"><b>Заблокировать приложение</b><span>Выйти из текущей сессии без удаления данных.</span></div><button class="btn" onclick="lockApp()">${icon("lock",15)}Заблокировать</button></div>
   <div class="setting"><div class="setting-info"><b>Выйти</b><span>Перезагрузить авторизацию CRM.</span></div><button class="btn" onclick="logout()">${icon("logout",15)}Выйти</button></div>
 </div></div>
 <div class="panel"><div class="panel-head"><div><h2>Опасная зона</h2><div class="panel-sub danger">Действия необратимы после удаления.</div></div></div><button class="btn danger" onclick="wipeAll()">${icon("trash",15)}Очистить все данные</button></div>
 <div class="panel"><div class="panel-head"><div><h2>О приложении</h2><div class="panel-sub">Bine Store CRM v2.0 · Firebase Firestore</div></div><span class="badge badge-closed">${icon("shield",12)}Защищено паролем</span></div><div class="small">Фотографии товаров хранятся в Firestore после автоматического сжатия. CRM рассчитана на работу с крупным каталогом и историей заказов, при этом клиент загружает только необходимые данные для текущего экрана.</div></div>`
}
async function saveSettings(){const shopName=$("#shopNameSetting").value.trim()||"Bine Store";state.settings.shopName=shopName;state.settings.currency="MDL";try{await setDoc(doc(db,"settings","main"),state.settings,{merge:true});render();showToast("Настройки сохранены")}catch(e){showToast(firebaseError(e),"bad")}}
window.changePassword=async()=>{openModal("Изменить пароль","После сохранения новый пароль будет использоваться при следующем входе.",`<div class="formgrid"><div class="field"><label>Новый пароль</label><input id="np1" type="password" class="control"></div><div class="field"><label>Повторите пароль</label><input id="np2" type="password" class="control"></div></div>`,async()=>{const a=$("#np1").value,b=$("#np2").value;if(a.length<4)return showToast("Минимум 4 символа","bad");if(a!==b)return showToast("Пароли не совпадают","bad");try{state.settings.passwordHash=await hashText(a);await setDoc(doc(db,"settings","main"),{passwordHash:state.settings.passwordHash},{merge:true});closeModal();showToast("Пароль изменён")}catch(e){showToast(firebaseError(e),"bad")}})}
window.exportJSON=()=>{const data={version:2,exportedAt:new Date().toISOString(),settings:state.settings,products:state.products,orders:state.orders,purchases:state.purchases,clients:state.clients,transactions:state.transactions};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="bine-store-crm-backup-"+isoToday()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);showToast("Резервная копия готова")}
window.importJSON=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.products)||!Array.isArray(d.orders)||!Array.isArray(d.clients)||!Array.isArray(d.transactions))throw Error("Неподдерживаемый формат JSON");if(!confirm("Импорт добавит данные к существующей базе. Продолжить?"))return;for(const [name,arr] of Object.entries({products:d.products,orders:d.orders,purchases:d.purchases||[],clients:d.clients,transactions:d.transactions})){for(const item of arr){const copy={...item},id=copy.id||uid();delete copy.id;await setDoc(doc(db,name,id),copy,{merge:true})}}if(d.settings){state.settings={...state.settings,...d.settings};await setDoc(doc(db,"settings","main"),state.settings,{merge:true})}await loadAll();showToast("Импорт завершён")}catch(x){showToast(x.message||"Ошибка импорта","bad")}e.target.value=""}
window.wipeAll=async()=>{if(!confirm("Удалить ВСЕ товары, заказы, клиентов и финансовые операции? Это нельзя отменить."))return;if(!confirm("Последнее предупреждение. Продолжить очистку?"))return;try{for(const [name,arr] of Object.entries({products:state.products,orders:state.orders,purchases:state.purchases,clients:state.clients,transactions:state.transactions})){for(const x of arr)await deleteDoc(doc(db,name,x.id))}await loadAll();showToast("Все данные удалены")}catch(e){showToast(firebaseError(e),"bad")}}

function morePage(){
  return pageHeader("Ещё","Дополнительные разделы CRM")+`<div class="more-cards">
    <div class="more-card" onclick="go('finance')"><div class="more-icon">${icon("wallet",20)}</div><h3>Финансы</h3><p>Доходы, расходы, бюджет и автоматические операции по заказам.</p></div>
    <div class="more-card" onclick="go('clients')"><div class="more-icon">${icon("users",20)}</div><h3>Клиенты</h3><p>Контакты, количество заказов, сумма покупок и заметки.</p></div>
    <div class="more-card" onclick="go('analytics')"><div class="more-icon">${icon("chart",20)}</div><h3>Аналитика</h3><p>Продажи, средний чек, популярные товары и остатки.</p></div>
    <div class="more-card" onclick="go('settings')"><div class="more-icon">${icon("settings",20)}</div><h3>Настройки</h3><p>Название магазина, резервные копии, пароль и очистка.</p></div>
  </div>`
}

function globalSearch(q){
  const value=(q||"").trim();
  if(!value){go("dashboard");return}
  const needle=value.toLowerCase();
  const inProducts=state.products.some(p=>(p.name+" "+p.category+" "+p.supplier+" "+p.model).toLowerCase().includes(needle));
  const inOrders=state.orders.some(o=>(o.number+" "+o.clientName+" "+o.status).toLowerCase().includes(needle));
  const inPurchases=state.purchases.some(o=>(o.number+" "+o.supplier+" "+o.status+" "+(o.items||[]).map(i=>i.name).join(" ")).toLowerCase().includes(needle));
  state.page=inProducts?"products":inOrders?"orders":inPurchases?"purchases":"clients";
  state.more=false;state.search=value;state.status="";state.category="";render();
}
function renderPage(){
 const m=$("#main");if(!m)return;
 if(state.page==="dashboard")m.innerHTML=dashboardPage();
 else if(state.page==="products")m.innerHTML=productsPage();
 else if(state.page==="orders")m.innerHTML=ordersPage();
 else if(state.page==="purchases")m.innerHTML=purchasesPage();
 else if(state.page==="clients")m.innerHTML=clientsPage();
 else if(state.page==="finance")m.innerHTML=financePage();
 else if(state.page==="analytics")m.innerHTML=analyticsPage();
 else if(state.page==="settings")m.innerHTML=settingsPage();
 else if(state.page==="more")m.innerHTML=morePage();
}

window.filterProductQuick=()=>{};
// The UI uses inline event attributes. In an ES module top-level names are not global,
// so make every UI handler and shared state explicitly available on window.
Object.assign(window,{
  state,$,$$,
  showToast,openModal,loadAll,renderPage,globalSearch,
  openProductView,openOrderView,removeOrder,
  openPurchaseView,removePurchase,
  saveSettings,
  icon,esc,num,fmtMoney,fmtDate,isoToday,
  firebaseError
});
async function boot(){
 try{
   await signInAnonymously(auth);
 }catch(e){console.error(e);renderError("Firebase Authentication не подключён. Включите Anonymous Authentication в Firebase Console.");}
}
onAuthStateChanged(auth,async user=>{
  if(!user)return;state.user=user;
  try{
    const snap=await getDoc(doc(db,"settings","main"));
    if(snap.exists())state.settings={...state.settings,...snap.data()};
    if(state.settings.dark){document.documentElement.dataset.theme="dark"}else{delete document.documentElement.dataset.theme}
    if(sessionStorage.getItem("bineUnlocked")==="1"&&state.settings.passwordHash)await loadAll();else{state.loading=false;state.settings.passwordHash?passwordView(false):passwordView(true)}
  }catch(e){renderError(firebaseError(e))}
});
boot();
</script>
