<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script>(function(){try{var q=new URLSearchParams(location.search).get("lang"),l=q||localStorage.getItem("bs-lang")||((navigator.language||"").toLowerCase().indexOf("ro")===0?"ro":"ru");if(l==="ro"){var d=document.documentElement;d.classList.add("i18n-wait");setTimeout(function(){d.classList.remove("i18n-wait")},2500)}}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Оформление заказа — Bine Store</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css?v=14">
</head>
<body>
<main id="main" class="wrap">
  <div id="checkoutView">
    <div class="page-head">
      <nav class="crumbs" aria-label="Навигация"><a href="index.html">Главная</a><span>Оформление</span></nav>
      <h1 class="page-title chrome-t">Оформление</h1>
    </div>
    <div class="co-steps" aria-hidden="true"><span class="on"><b>1</b>Корзина</span><i></i><span class="on"><b>2</b>Данные</span><i></i><span><b>3</b>Готово</span></div>

    <div class="co" id="co">
      <form id="form" novalidate>
        <div class="signin-hint" id="signinHint" hidden>
          <span>Войдите, чтобы следить за заказом в личном кабинете</span>
          <a class="btn btn-ghost btn-sm" href="account.html?next=checkout.html">Войти</a>
        </div>

        <div class="co-block">
          <h2>Контакты</h2>
          <div class="row2">
            <label class="field"><span>Имя</span><input class="input" name="name" autocomplete="name" required></label>
            <label class="field"><span>Телефон</span><input class="input" name="phone" type="tel" autocomplete="tel" placeholder="+373 6__ __ ___" required></label>
          </div>
        </div>

        <div class="co-block">
          <h2>Получение</h2>
          <div class="opts">
            <label class="opt"><input type="radio" name="delivery" value="meet" checked>
              <span class="opt-body"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span><b>Встреча в Кишинёве</b><small>Бесплатно, с примеркой</small></span></span></label>
            <label class="opt"><input type="radio" name="delivery" value="ship">
              <span class="opt-body"><svg viewBox="0 0 24 24"><path d="M2.5 6.5h11v10h-11zM13.5 10h4.2l3.3 3.4v3.1h-7.5"/><circle cx="6.5" cy="17.5" r="1.9"/><circle cx="17" cy="17.5" r="1.9"/></svg><span><b>Доставка по Молдове</b><small>Почта или курьер, 1–3 дня</small></span></span></label>
          </div>
          <div class="stack" id="shipFields" hidden style="margin-top:14px">
            <label class="field"><span>Город или село</span><input class="input" name="city" autocomplete="address-level2"></label>
            <label class="field"><span>Адрес или отделение почты</span><input class="input" name="address" autocomplete="street-address"></label>
          </div>
        </div>

        <div class="co-block">
          <h2>Связь <small>как удобнее подтвердить заказ</small></h2>
          <div class="opts opts-3" id="messengers"></div>
          <label class="field" style="margin-top:14px"><span>Комментарий</span><textarea class="textarea" name="comment" rows="3" placeholder="Например, удобное время встречи"></textarea></label>
        </div>
        <label class="consent check"><input type="checkbox" name="agree" required> <span>Я принимаю <a href="terms.html" target="_blank">условия</a>, <a href="returns.html" target="_blank">правила возврата</a> и даю согласие на обработку данных по <a href="privacy.html" target="_blank">политике конфиденциальности</a></span></label>
        <p class="form-err" id="err" role="alert"></p>
      </form>

      <aside class="co-summary" aria-label="Ваш заказ">
        <h2>Ваш заказ</h2>
        <ul class="line-items" id="lines"></ul>
        <div class="sum-row"><span>Товары</span><span id="subtotal"></span></div>
        <div class="sum-row"><span>Получение</span><span id="delivCost">Бесплатно</span></div>
        <div class="sum-row total"><span>Итого</span><b id="total"></b></div>
        <button class="btn btn-dark btn-block" id="submit" form="form" type="submit">Подтвердить заказ</button>
        <p class="note"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5.5c0 4.3 3 7.8 7 9.5 4-1.7 7-5.2 7-9.5V6l-7-3Z"/></svg>Оплата при получении</p>
      </aside>
    </div>
  </div>
  <div id="doneView" hidden></div>
</main>
<script type="module" src="js/pages/checkout.js?v=14"></script>
</body>
</html>
